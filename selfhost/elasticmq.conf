include classpath("application.conf")

# SQS-compatible queues for the self-hosted OCR site: same names, visibility timeouts and
# redrive (maxReceiveCount) as infra/queues.tf.

node-address { protocol = http, host = sqs, port = 9324, context-path = "" }
rest-sqs { enabled = true, bind-port = 9324, bind-hostname = "0.0.0.0", sqs-limits = relaxed }
rest-stats { enabled = false }

# Keep queues and messages across restarts.
queues-storage { enabled = true, path = "/data/queues.conf" }
messages-storage { enabled = true, uri = "jdbc:h2:/data/elasticmq" }

queues {
  ocr-ingest-dlq { defaultVisibilityTimeout = 180 seconds }
  ocr-ingest {
    defaultVisibilityTimeout = 1020 seconds
    deadLettersQueue { name = "ocr-ingest-dlq", maxReceiveCount = 5 }
  }
  ocr-process-dlq { defaultVisibilityTimeout = 180 seconds }
  ocr-process {
    defaultVisibilityTimeout = 1020 seconds
    deadLettersQueue { name = "ocr-process-dlq", maxReceiveCount = 5 }
  }
  ocr-textract-dlq { defaultVisibilityTimeout = 180 seconds }
  ocr-textract {
    defaultVisibilityTimeout = 240 seconds
    deadLettersQueue { name = "ocr-textract-dlq", maxReceiveCount = 12 }
  }
  ocr-textract-done-dlq { defaultVisibilityTimeout = 180 seconds }
  ocr-textract-done {
    defaultVisibilityTimeout = 1020 seconds
    deadLettersQueue { name = "ocr-textract-done-dlq", maxReceiveCount = 5 }
  }
  ocr-tesseract-dlq { defaultVisibilityTimeout = 180 seconds }
  ocr-tesseract {
    defaultVisibilityTimeout = 1020 seconds
    deadLettersQueue { name = "ocr-tesseract-dlq", maxReceiveCount = 3 }
  }
  ocr-assemble-dlq { defaultVisibilityTimeout = 180 seconds }
  ocr-assemble {
    defaultVisibilityTimeout = 1020 seconds
    deadLettersQueue { name = "ocr-assemble-dlq", maxReceiveCount = 5 }
  }
  ocr-finalize-dlq { defaultVisibilityTimeout = 180 seconds }
  ocr-finalize {
    defaultVisibilityTimeout = 1020 seconds
    deadLettersQueue { name = "ocr-finalize-dlq", maxReceiveCount = 5 }
  }
  ocr-compress-dlq { defaultVisibilityTimeout = 180 seconds }
  ocr-compress {
    defaultVisibilityTimeout = 3600 seconds
    deadLettersQueue { name = "ocr-compress-dlq", maxReceiveCount = 3 }
  }
}
