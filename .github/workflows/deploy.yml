name: Deploy
# Runs on every push to main once the repo variable DEPLOY_ENABLED is "true" (after the first
# local deploy has created the OIDC role), and on demand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # GitHub OIDC -> AWS role, no long-lived keys
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never interrupt a terraform apply

jobs:
  checks:
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    # Native arm64 runner (free for public repos): the arm64 Tesseract image builds without
    # QEMU emulation, about 3x faster.
    runs-on: ubuntu-24.04-arm
    environment: production
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      SUPERADMIN_EMAIL: ${{ vars.SUPERADMIN_EMAIL }}
      ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
      DOMAIN: ${{ vars.DOMAIN || 'ocr.divyeshvishwakarma.com' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AUTO_APPROVE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.17.2, terraform_wrapper: false }
      - uses: docker/setup-buildx-action@v3
      - name: AWS CLI
        run: |
          aws --version 2>/dev/null || {
            curl -sSfL https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp && sudo /tmp/aws/install
          }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200
      - name: Deploy
        run: ./scripts/deploy.sh
