name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - name: Install Tesseract (for the real-OCR worker test)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr poppler-utils
      - name: Lint + tests
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          ruff check src tests
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: npm ci && npm run build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.17.2 }
      - name: fmt + validate
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Tesseract image builds (amd64 smoke build)
        run: docker build -f backend/tesseract/Dockerfile backend
